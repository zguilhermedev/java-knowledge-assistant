services:
  app:
    build:
      context: .
    environment:
      SERVER_PORT: 8082
      SPRING_PROFILES_ACTIVE: knowledge,ollama,pgvector
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:v1.5}
      PGVECTOR_HOST: postgres
      PGVECTOR_PORT: 5432
      PGVECTOR_DATABASE: ${POSTGRES_DB:-knowledge_assistant}
      PGVECTOR_USER: ${POSTGRES_USER:-knowledge_assistant}
      PGVECTOR_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_assistant_local}
      PGVECTOR_TABLE: ${PGVECTOR_TABLE:-knowledge_embeddings_nomic_v15}
      PGVECTOR_DIMENSION: ${PGVECTOR_DIMENSION:-768}
      KNOWLEDGE_CORPUS_PATH: /app/corpus
    ports:
      - "127.0.0.1:${SERVER_PORT:-8082}:8082"
    volumes:
      - ./docs/corpus:/app/corpus:ro
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
