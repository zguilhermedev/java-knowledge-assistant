name: java-knowledge-assistant-tests
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: knowledge_test
      POSTGRES_USER: knowledge_test
      POSTGRES_PASSWORD: knowledge_test_local
    ports:
      - "127.0.0.1:15433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_test -d knowledge_test"]
      interval: 2s
      timeout: 5s
      retries: 30
