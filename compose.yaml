name: java-knowledge-assistant

# Infraestrutura de desenvolvimento. A aplicação roda pelo Maven Wrapper no host.
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_assistant_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama:
    image: ollama/ollama:0.35.1
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11534}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
  ollama-data:
